<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>VAUNAFLIX</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<!-- Animação de abertura -->
<div id="intro" hidden aria-hidden="true">
  <div class="beams"><i></i><i></i><i></i><i></i><i></i></div>
  <div class="iw" id="iw" aria-label="VAUNAFLIX"></div>
</div>

<!-- Quem está assistindo? -->
<div id="profiles" hidden>
  <header class="ptop"><span class="wm">VAUNAFLIX</span></header>
  <div class="pwrap">
    <h1 id="pTitleH">Quem está assistindo?</h1>
    <div id="plist" class="plist"></div>
    <button id="pManage" class="pbtn">Gerenciar perfis</button>
  </div>
</div>

<div id="app" hidden>
  <header id="nb">
    <button class="wm" id="logoBtn" aria-label="Início">VAUNAFLIX</button>
    <nav id="links" aria-label="Seções">
      <button data-view="home" class="on">Início</button>
      <button data-view="l">Ao vivo</button>
      <button data-view="m">Filmes</button>
      <button data-view="s">Séries</button>
      <button data-view="fav">Minha lista</button>
    </nav>
    <div class="nr">
      <label id="sb" class="sb"><button type="button" id="sBtn" aria-label="Buscar"><i data-ic="search"></i></button><input id="q" type="search" placeholder="Títulos, canais, categorias" autocomplete="off" enterkeyhint="search"></label>
      <button id="castPill" class="pill" title="Reproduzir em"><i data-ic="cast"></i><span id="castName">Este aparelho</span></button>
      <div id="acct">
        <button id="avBtn" aria-label="Conta e perfis"><span class="av" id="avSm"></span><span class="caret"></span></button>
        <div id="drop" hidden>
          <div id="dropProfiles"></div>
          <button data-go="manage">Gerenciar perfis</button>
          <button data-view="tvs"><i data-ic="cast"></i>TVs e controle remoto</button>
          <button data-view="src"><i data-ic="list"></i>Fontes de listas</button>
          <button data-act="logout" class="out">Sair do VAUNAFLIX</button>
        </div>
      </div>
    </div>
  </header>

  <main id="main">
    <section id="home" class="view"></section>

    <section id="browse" class="view" hidden>
      <div class="bhead"><h1 id="browseTitle">Filmes</h1></div>
      <div id="filters">
        <div id="chips" class="chips"></div>
        <select id="srcSel" aria-label="Fonte"></select>
      </div>
      <div id="grid" class="grid"></div>
      <div id="empty" class="empty" hidden></div>
      <div id="more" class="more">Carregando…</div>
    </section>

    <section id="tvs" class="page view" hidden></section>
    <section id="src" class="page view" hidden></section>
    <section id="menu" class="page view" hidden></section>
  </main>

  <nav id="tabs" aria-label="Seções">
    <button data-view="home" class="on"><i data-ic="home"></i><span>Início</span></button>
    <button data-view="l"><i data-ic="tv"></i><span>Ao vivo</span></button>
    <button data-view="m"><i data-ic="film"></i><span>Filmes</span></button>
    <button data-view="s"><i data-ic="layers"></i><span>Séries</span></button>
    <button data-view="more"><i data-ic="more"></i><span>Mais</span></button>
  </nav>
</div>

<!-- Detalhe de série / adicionar fonte -->
<div id="modal" class="modal" hidden>
  <div class="sheet" role="dialog" aria-modal="true">
    <button id="modalX" class="x" aria-label="Fechar"><i data-ic="x"></i></button>
    <div id="sheetBody"></div>
  </div>
</div>

<!-- Player -->
<div id="player" hidden>
  <video id="vid" playsinline webkit-playsinline autoplay></video>
  <div id="pTop" class="pshow">
    <button id="pBack" class="ib" aria-label="Voltar"><i data-ic="back"></i></button>
    <div class="pt"><b id="pTitle"></b><small id="pSub"></small></div>
  </div>
  <div id="pSpin" class="spin" hidden></div>
  <div id="pErr" class="perr" hidden>
    <p id="pErrMsg"></p>
    <div class="row">
      <button id="pRetry" class="btn">Tentar de novo</button>
      <button id="pDirect" class="btn ghost">Link direto</button>
      <button id="pClose" class="btn ghost">Fechar</button>
    </div>
  </div>
  <div id="pToast" class="ptoast" hidden></div>
  <div id="pCenter" class="pshow">
    <button id="bRew" class="ib" aria-label="Voltar 10 segundos" hidden><i data-ic="rew"></i></button>
    <button id="bPrev" class="ib" aria-label="Anterior"><i data-ic="prev"></i></button>
    <button id="bPlay" class="ib big" aria-label="Pausar"><i data-ic="pause"></i></button>
    <button id="bNext" class="ib" aria-label="Próximo"><i data-ic="next"></i></button>
    <button id="bFwd" class="ib" aria-label="Avançar 10 segundos" hidden><i data-ic="fwd"></i></button>
  </div>
  <div id="pBar" class="pshow">
    <div id="seekRow" class="seek" hidden>
      <span id="tCur">0:00</span>
      <input id="seek" type="range" min="0" max="1000" value="0">
      <span id="tDur">0:00</span>
    </div>
    <div class="ctl">
      <button id="bAlt" class="ib txt" aria-label="Trocar versão"><i data-ic="layers"></i><em id="altTxt">1/1</em></button>
      <span class="sp"></span>
      <button id="bFav" class="ib" aria-label="Favoritar"><i data-ic="star"></i></button>
      <button id="bMute" class="ib" aria-label="Som"><i data-ic="vol"></i></button>
      <button id="bCast" class="ib" aria-label="Enviar para a TV"><i data-ic="cast"></i></button>
      <button id="bFull" class="ib" aria-label="Tela cheia"><i data-ic="full"></i></button>
    </div>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<script src="vendor/hls.min.js"></script>
<script src="vendor/mpegts.js"></script>
<script src="js/util.js"></script>
<script src="js/nav.js"></script>
<script src="js/player.js"></script>
<script src="js/app.js"></script>
</body>
</html>
