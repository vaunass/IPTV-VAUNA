<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Entrar · VAUNAFLIX</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/login.css">
</head>
<body>
<div class="wall" id="wall" aria-hidden="true"></div>
<div class="shade"></div>
<header class="top"><span class="wm" id="wmL">VAUNAFLIX</span></header>
<main class="wrap">
  <form id="f" class="box" autocomplete="on">
    <h1>Entrar</h1>
    <div class="fl"><input id="u" name="username" placeholder=" " autocomplete="username" autocapitalize="none" spellcheck="false" required><label for="u">Usuário</label></div>
    <div class="fl"><input id="p" name="password" type="password" placeholder=" " autocomplete="current-password" required><label for="p">Senha</label>
      <button type="button" id="eye" class="eye" aria-label="Mostrar senha" tabindex="-1">MOSTRAR</button></div>
    <div id="err" role="alert"></div>
    <button id="go" type="submit">Entrar</button>
    <p class="hint">Acesso privado. Use o login que você criou ao instalar.</p>
  </form>
</main>
<script>
(function () {
  // mural de "pôsteres" animado (só cores, sem imagens externas)
  var wall = document.getElementById('wall'), h = '';
  for (var i = 0; i < 84; i++) {
    var hue = (i * 47 + (i % 7) * 23) % 360;
    h += '<i style="--h:' + hue + ';--d:' + ((i * 53) % 900) + 'ms"></i>';
  }
  wall.innerHTML = h;
  var wl = document.getElementById('wmL'), t = wl.textContent, hh = '';
  for (var k = 0; k < t.length; k++) hh += '<b style="--i:' + k + '">' + t.charAt(k) + '</b>';
  wl.innerHTML = hh; wl.setAttribute('aria-label', t);

  var f = document.getElementById('f'), err = document.getElementById('err'), go = document.getElementById('go');
  var next = (location.search.match(/[?&]next=([^&]+)/) || [])[1];
  next = next ? decodeURIComponent(next) : '/';
  if (next.charAt(0) !== '/' || next.charAt(1) === '/') next = '/';
  fetch('/api/me').then(function (r) { return r.json(); }).then(function (j) { if (j.authed) location.replace(next); });
  var p = document.getElementById('p');
  document.getElementById('eye').onclick = function () {
    var show = p.type === 'password'; p.type = show ? 'text' : 'password'; this.textContent = show ? 'OCULTAR' : 'MOSTRAR';
  };
  setTimeout(function () { document.getElementById('u').focus(); }, 700);
  f.addEventListener('submit', function (e) {
    e.preventDefault();
    err.textContent = ''; go.disabled = true; go.classList.add('busy');
    fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ user: document.getElementById('u').value, pass: p.value }) })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (r) {
        if (r.ok) { try { sessionStorage.removeItem('iptv.intro'); } catch (e) {} return location.replace(next); }
        err.textContent = r.j.error || 'Não foi possível entrar.';
        go.disabled = false; go.classList.remove('busy'); p.value = ''; p.focus();
        f.classList.remove('shake'); void f.offsetWidth; f.classList.add('shake');
      })
      .catch(function () { err.textContent = 'Sem conexão com o servidor.'; go.disabled = false; go.classList.remove('busy'); });
  });
})();
</script>
</body>
</html>
